[ime]
# This Mac enables "U.S." (not ABC). Alias name ABC in kanata.kbd still resolves here.
abc = "com.apple.keylayout.US"
korean_2set = "com.apple.inputmethod.Korean.2SetKorean"

# Hyper+J → `sunghyun open browser` (OS default HTTP handler). No apps.browser key.

[apps.calendar]
bundle_id = "com.apple.iCal"
name = "Calendar"

[apps.iina]
bundle_id = "com.colliderli.iina"
name = "IINA"

[apps.kakaotalk]
bundle_id = "com.kakao.KakaoTalkMac"
name = "KakaoTalk"

[apps.linear]
bundle_id = "com.linear"
name = "Linear"

[apps.mail]
bundle_id = "com.apple.mail"
name = "Mail"

[apps.music]
bundle_id = "com.apple.Music"
name = "Music"

[apps.preview]
bundle_id = "com.apple.Preview"
name = "Preview"

[apps.slack]
bundle_id = "com.tinyspeck.slackmacgap"
name = "Slack"

[apps.ghostty]
bundle_id = "com.mitchellh.ghostty"
name = "Ghostty"

[apps.tableplus]
bundle_id = "com.tinyapp.TablePlus"
name = "TablePlus"

[aliases]
terminal = "ghostty"
planetscale = "tableplus"

[tiles]
gap = 0

[launcher]
# Optional alternate chooser. Default Mac setup restores Apple Spotlight on Cmd-Space.
enabled = true

[clipboard]
# Disabled: use Spotlight Clipboard Search (Cmd-Space then Cmd-4). Apple has no global Cmd-Shift-V.
enabled = false
history_limit = 50

[paths]
kanata_kbd = "~/.config/sunghyun/kanata.kbd"
