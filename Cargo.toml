[package]
name = "sunghyun"
version = "0.1.0"
edition = "2021"
description = "Keyboard and desktop actions companion for sunghyun.nix"
license = "MIT"
repository = "https://github.com/anaclumos/sunghyun.nix"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
